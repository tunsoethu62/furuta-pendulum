; PlatformIO setup for the Furuta pendulum sketches (Arduino Uno).
; Each sketch is its own environment; the Arduino-IDE folders (step_test/, vref_reader/, ...) stay unchanged
; and still open in the Arduino IDE. PlatformIO builds them through tiny wrappers in pio/<sketch>/main.cpp.
;
;   pio run -e step_test                      build only
;   pio run -e step_test -t upload            build + upload   (needs your go-ahead: the board runs it)
;   pio device monitor                        serial monitor at 115200 (Ctrl+C to quit)
;   pio device list                           show COM ports

[platformio]
src_dir = pio
default_envs = step_test

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; Uncomment and set if auto-detect picks the wrong port:
; upload_port = COM3
; monitor_port = COM3

[env:step_test]
build_src_filter = +<step_test/>

[env:vref_reader]
build_src_filter = +<vref_reader/>

[env:as5600_read]
build_src_filter = +<as5600_read/>
; Wire is built in; listed explicitly because its #include sits inside the wrapped .ino
lib_deps = Wire

[env:motor_testing]
build_src_filter = +<motor_testing/>

[env:acceleartion]
build_src_filter = +<acceleartion/>

[env:motion_core]
build_src_filter = +<motion_core/>
; Wire is built in; listed explicitly because its #include sits inside the wrapped .ino
lib_deps = Wire

[env:balance]
build_src_filter = +<balance/>
; Wire is built in; listed explicitly because its #include sits inside the wrapped .ino
lib_deps = Wire

[env:swingup]
build_src_filter = +<swingup/>
lib_deps = Wire
